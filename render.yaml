services:
  - type: web
    name: media-scheduler-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: DB_PATH
        value: /tmp/media_scheduler.db

  - type: web
    name: media-scheduler-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4173
      - key: VITE_API_URL
        value: https://media-scheduler-backend.onrender.com
