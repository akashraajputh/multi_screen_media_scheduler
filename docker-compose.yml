services:
  backend:
    build:
      context: ./backend
    container_name: media-scheduler-backend
    environment:
      PORT: 8080
      DB_PATH: /data/media_scheduler.db
    ports:
      - "8080:8080"
    volumes:
      - backend_data:/data

  frontend:
    build:
      context: ./frontend
    container_name: media-scheduler-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"

volumes:
  backend_data:
